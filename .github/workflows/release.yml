name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, 2025-12-02

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34, 2025-09-24
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7, 2026-01-08
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # Gate the release on the same checks CI runs, so a tag can never publish
      # something that would have failed on main.
      - name: Build, test and lint
        run: nix develop -c just ci

      # `just dist` asserts the tag matches the version cargo would build.
      - name: Build static musl artifacts
        run: nix develop -c just dist "${GITHUB_REF_NAME}"

      # A smoke test on the artifact that will actually be shipped, not on a
      # host-native build that might differ.
      - name: Smoke-test the x86_64 binary
        run: |
          tar -xzf "dist/irciii-${GITHUB_REF_NAME}-x86_64-unknown-linux-musl.tar.gz" -C /tmp
          /tmp/irciii --version
          /tmp/irciii --list

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2, 2026-07-13
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
